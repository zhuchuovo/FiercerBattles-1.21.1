plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = 'FiercerBattles'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        fiercerbattles {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Better Combat 2.4.0+1.21.1 is embedded under src/main/java/com/fiercerbattles/bettercombat.
    // Player Animator and Cloth Config are its runtime dependencies; tiny-config is bundled.
    implementation 'maven.modrinth:gedNE4y2:HJZB6bmA' // Player Animator 2.0.4+1.21.1-forge
    implementation 'me.shedaniel.cloth:cloth-config-neoforge:15.0.130'
    jarJar(implementation("maven.modrinth:tiny-config:${tiny_config_version}"))

    // Optional Better Combat compat (FTB Teams), only used when the mod is present.
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            version: mod_version,
            loader_range: loader_range,
            minecraft_range: minecraft_range,
            neo_range: neo_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
